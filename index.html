<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F5F6F8" />
<title>Wayfare — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="stage">
    <span class="stage__label">Main · Pickup &amp; Destination — 375×812</span>

    <div class="screen" id="screen-home">

      <!-- status bar -->
      <div class="statusbar">
        <span class="statusbar__time">9:41</span>
        <div class="statusbar__icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="1" y="7" width="3" height="4" rx="0.5" fill="currentColor"/><rect x="6" y="5" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="11" y="2" width="3" height="9" rx="0.5" fill="currentColor"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5.2L13.4 6.3C12 4.9 10.1 4 8 4C5.9 4 4 4.9 2.6 6.3L1.5 5.2C3.2 3.5 5.5 2.5 8 2.5ZM8 6.2C9.4 6.2 10.7 6.8 11.6 7.7L10.5 8.8C9.9 8.2 9 7.7 8 7.7C7 7.7 6.1 8.2 5.5 8.8L4.4 7.7C5.3 6.8 6.6 6.2 8 6.2ZM8 9.9C8.6 9.9 9.1 10.1 9.5 10.5L8 12L6.5 10.5C6.9 10.1 7.4 9.9 8 9.9Z" fill="currentColor"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="currentColor" stroke-width="1"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.7" fill="currentColor"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.2" fill="currentColor"/></svg>
        </div>
      </div>

      <!-- premium custom map -->
      <div class="map-layer">
        <div class="map" id="map" aria-hidden="true">
          <svg id="map-svg" viewBox="0 0 375 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#DCE9E6"/>
                <stop offset="1" stop-color="#CFE1DD"/>
              </linearGradient>
              <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1F2430" flood-opacity="0.10"/>
              </filter>
            </defs>

            <rect width="375" height="300" fill="#F1F2EE"/>

            <!-- water inlet, top-left corner -->
            <path d="M-20,-20 L130,-20 C100,30 45,60 -20,78 Z" fill="url(#waterGrad)"/>

            <!-- park, bottom-right corner -->
            <path d="M375,175 C340,168 305,190 293,222 C281,254 297,288 330,300 L375,300 Z" fill="#DCE7DC"/>

            <!-- minor roads -->
            <path d="M-20,60 L400,40" stroke="#E6E7E2" stroke-width="9"/>
            <path d="M-20,258 L400,272" stroke="#E6E7E2" stroke-width="8"/>
            <path d="M55,-20 L35,320" stroke="#E6E7E2" stroke-width="8"/>
            <path d="M330,-20 L348,320" stroke="#E6E7E2" stroke-width="7"/>

            <!-- major roads (lighter, on top, subtle depth), crossing near the marker -->
            <path d="M-20,165 L400,145" stroke="#1F2430" stroke-opacity="0.06" stroke-width="17" transform="translate(0,2)"/>
            <path d="M-20,165 L400,145" stroke="#FDFDFC" stroke-width="15"/>
            <path d="M150,-20 L230,320" stroke="#1F2430" stroke-opacity="0.06" stroke-width="15" transform="translate(2,0)"/>
            <path d="M150,-20 L230,320" stroke="#FDFDFC" stroke-width="13"/>

            <!-- lane markings on the major roads -->
            <path d="M-20,165 L400,145" stroke="#E2E4DE" stroke-width="1.4" stroke-dasharray="7 8"/>
            <path d="M150,-20 L230,320" stroke="#E2E4DE" stroke-width="1.4" stroke-dasharray="7 8"/>

            <!-- buildings -->
            <g filter="url(#softShadow)">
              <rect x="66" y="16" width="46" height="34" rx="6" fill="#E7E8E3"/>
              <rect x="270" y="8" width="36" height="42" rx="6" fill="#E7E8E3"/>
              <rect x="24" y="190" width="52" height="58" rx="6" fill="#E7E8E3"/>
              <rect x="252" y="70" width="32" height="40" rx="6" fill="#E7E8E3"/>
              <rect x="96" y="205" width="38" height="32" rx="6" fill="#E7E8E3"/>
            </g>

            <!-- street labels -->
            <text x="66" y="158" font-family="Inter, sans-serif" font-size="8.5" fill="#9AA0A6" transform="rotate(-3 66 158)" letter-spacing="0.4">Elm Avenue</text>
            <text x="303" y="240" font-family="Inter, sans-serif" font-size="8" fill="#AFB4B8" letter-spacing="0.4">Riverside Green</text>

            <!-- dynamic route + destination marker, populated by script.js -->
            <g id="dynamic-route"></g>

            <!-- current location marker, at the intersection -->
            <g transform="translate(191,155)">
              <circle r="22" fill="#4F46E5" opacity="0.10" class="pulse-ring pulse-ring--1"/>
              <circle r="22" fill="#4F46E5" opacity="0.10" class="pulse-ring pulse-ring--2"/>
              <circle r="9" fill="#FFFFFF"/>
              <circle r="6.5" fill="#4F46E5"/>
            </g>
          </svg>
        </div>

        <div class="map-scrim" aria-hidden="true"></div>

        <!-- top controls -->
        <button class="fab fab--menu" id="menu-btn" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2.5 5H15.5M2.5 9H15.5M2.5 13H15.5" stroke="#14171F" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="fab fab--avatar" id="profile-btn" aria-label="Profile">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><circle cx="9.5" cy="6.6" r="3.1" stroke="#14171F" stroke-width="1.5"/><path d="M3.3 16C4.2 12.6 6.6 11 9.5 11C12.4 11 14.8 12.6 15.7 16" stroke="#14171F" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>

        <!-- floating locate button -->
        <button class="fab fab--locate" id="locate-btn" aria-label="Center on current location">
          <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><circle cx="9.5" cy="9.5" r="2.6" fill="#4F46E5"/><path d="M9.5 1.5V4.6M9.5 14.4V17.5M1.5 9.5H4.6M14.4 9.5H17.5" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- bottom sheet -->
      <div class="sheet" id="sheet">
        <div class="sheet__handle"></div>

        <div class="sheet__viewport" id="sheet-viewport">

          <!-- default view -->
          <div class="sheet__view is-active" data-view="default">
            <button class="search-field" id="search-trigger-btn">
              <span class="search-field__icon">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.5" stroke="#6B7280" stroke-width="1.6"/><path d="M12.2 12.2L16 16" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/></svg>
              </span>
              <span class="search-field__text">Where to?</span>
            </button>

            <div class="route-card">
              <span class="route-line" aria-hidden="true"></span>
              <span class="route-dot route-dot--origin"></span>
              <div class="route-row route-row--origin">
                <span class="route-row__title">Current location</span>
                <span class="route-row__subtitle">14 Baker Street, Marylebone</span>
              </div>
              <div class="route-row-divider"></div>
              <span class="route-dot route-dot--dest"></span>
              <div class="route-row route-row--input" id="destination-row-btn" role="button" tabindex="0">
                <span class="route-row__title route-row__title--placeholder" id="destination-label">Enter destination</span>
                <button class="destination-clear-btn" id="destination-clear-btn" aria-label="Clear destination" hidden>
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 1.5L10.5 10.5M10.5 1.5L1.5 10.5" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
              </div>
            </div>

            <button class="add-stop-btn" id="add-stop-btn">
              <span class="add-stop-btn__icon">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2.5V11.5M2.5 7H11.5" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round"/></svg>
              </span>
              Add stop
            </button>

            <div class="stops-list" id="stops-list"></div>

            <div class="sheet__divider"></div>

            <div class="sheet__section-title">Recent places</div>

            <div class="recent-list" id="recent-list">
              <button class="recent-row" data-title="Kingston Business Park" data-subtitle="Kingston upon Thames, KT2">
                <span class="recent-row__icon">
                  <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.5 1.8C5.8 1.8 3.8 3.9 3.8 6.5C3.8 10 8.5 15.2 8.5 15.2C8.5 15.2 13.2 10 13.2 6.5C13.2 3.9 11.2 1.8 8.5 1.8Z" stroke="#6B7280" stroke-width="1.4"/><circle cx="8.5" cy="6.5" r="1.7" stroke="#6B7280" stroke-width="1.4"/></svg>
                </span>
                <span class="recent-row__text">
                  <span class="recent-row__title">Kingston Business Park</span>
                  <span class="recent-row__subtitle">Kingston upon Thames, KT2</span>
                </span>
              </button>
              <button class="recent-row" data-title="Heathrow Airport, T5" data-subtitle="Longford, TW6">
                <span class="recent-row__icon">
                  <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.5 1.8C5.8 1.8 3.8 3.9 3.8 6.5C3.8 10 8.5 15.2 8.5 15.2C8.5 15.2 13.2 10 13.2 6.5C13.2 3.9 11.2 1.8 8.5 1.8Z" stroke="#6B7280" stroke-width="1.4"/><circle cx="8.5" cy="6.5" r="1.7" stroke="#6B7280" stroke-width="1.4"/></svg>
                </span>
                <span class="recent-row__text">
                  <span class="recent-row__title">Heathrow Airport, T5</span>
                  <span class="recent-row__subtitle">Longford, TW6</span>
                </span>
              </button>
              <button class="recent-row" data-title="The Ivy, Covent Garden" data-subtitle="1-5 West Street, WC2H">
                <span class="recent-row__icon">
                  <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.5 1.8C5.8 1.8 3.8 3.9 3.8 6.5C3.8 10 8.5 15.2 8.5 15.2C8.5 15.2 13.2 10 13.2 6.5C13.2 3.9 11.2 1.8 8.5 1.8Z" stroke="#6B7280" stroke-width="1.4"/><circle cx="8.5" cy="6.5" r="1.7" stroke="#6B7280" stroke-width="1.4"/></svg>
                </span>
                <span class="recent-row__text">
                  <span class="recent-row__title">The Ivy, Covent Garden</span>
                  <span class="recent-row__subtitle">1-5 West Street, WC2H</span>
                </span>
              </button>
            </div>
          </div>

          <!-- search view -->
          <div class="sheet__view" data-view="search">
            <div class="search-view__header">
              <button class="icon-btn-back" id="search-back-btn" aria-label="Back">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3.5L5 9L11 14.5" stroke="#14171F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="search-view__field">
                <span class="search-field__icon">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.5" stroke="#6B7280" stroke-width="1.6"/><path d="M12.2 12.2L16 16" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/></svg>
                </span>
                <input class="search-view__input" id="destination-input" type="text" placeholder="Enter destination" autocomplete="off" />
              </div>
            </div>
            <div class="suggestions-list" id="suggestions-list"></div>
          </div>

        </div>
      </div>

      <div class="home-indicator"></div>

      <!-- side navigation drawer -->
      <div class="modal-scrim" id="menu-scrim"></div>
      <div class="drawer" id="menu-drawer" role="dialog" aria-label="Navigation menu">
        <div class="drawer__header">
          <div class="drawer__avatar">
            <svg width="22" height="22" viewBox="0 0 19 19" fill="none"><circle cx="9.5" cy="6.6" r="3.1" stroke="#FFFFFF" stroke-width="1.5"/><path d="M3.3 16C4.2 12.6 6.6 11 9.5 11C12.4 11 14.8 12.6 15.7 16" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <span class="drawer__name">Welcome</span>
          <button class="icon-btn-close" id="menu-close-btn" aria-label="Close menu">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.5 1.5L12.5 12.5M12.5 1.5L1.5 12.5" stroke="#14171F" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>
        <nav class="drawer__nav">
          <button class="drawer__item">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 3.5L17 9.5" stroke="#14171F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 8.5V16C5 16.5 5.5 17 6 17H14C14.5 17 15 16.5 15 16V8.5" stroke="#14171F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Home
          </button>
          <button class="drawer__item">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="11" rx="2" stroke="#14171F" stroke-width="1.5"/><path d="M3 9H17" stroke="#14171F" stroke-width="1.5"/><path d="M7 5V3.5M13 5V3.5" stroke="#14171F" stroke-width="1.5" stroke-linecap="round"/></svg>
            Your trips
          </button>
          <button class="drawer__item">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="5" width="15" height="10.5" rx="2" stroke="#14171F" stroke-width="1.5"/><rect x="2.5" y="7.8" width="15" height="2.2" fill="#14171F"/></svg>
            Payment
          </button>
          <button class="drawer__item">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10.5 2.5L17 9L9.5 16.5C9 17 8.3 17 7.8 16.5L2.8 11.5C2.3 11 2.3 10.3 2.8 9.8L10.5 2.5Z" stroke="#14171F" stroke-width="1.5" stroke-linejoin="round"/><circle cx="6" cy="6.3" r="1.1" fill="#14171F"/></svg>
            Promotions
          </button>
          <button class="drawer__item">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.6" stroke="#14171F" stroke-width="1.5"/><path d="M10 3V5M10 15V17M17 10H15M5 10H3M15.1 4.9L13.7 6.3M6.3 13.7L4.9 15.1M15.1 15.1L13.7 13.7M6.3 6.3L4.9 4.9" stroke="#14171F" stroke-width="1.5" stroke-linecap="round"/></svg>
            Settings
          </button>
          <button class="drawer__item">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="#14171F" stroke-width="1.5"/><path d="M7.8 7.6C8 6.6 8.9 5.9 10 5.9C11.2 5.9 12.2 6.8 12.2 7.9C12.2 9.6 10 9.4 10 11.5" stroke="#14171F" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="14.1" r="0.9" fill="#14171F"/></svg>
            Help
          </button>
        </nav>
      </div>

      <!-- add-stop sheet -->
      <div class="modal-scrim" id="addstop-scrim"></div>
      <div class="addstop-sheet" id="addstop-sheet" role="dialog" aria-label="Add a stop">
        <div class="sheet__handle"></div>
        <div class="addstop-sheet__header">
          <span class="addstop-sheet__title">Add a stop</span>
          <button class="icon-btn-close" id="addstop-close-btn" aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.5 1.5L12.5 12.5M12.5 1.5L1.5 12.5" stroke="#14171F" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="search-view__field">
          <span class="search-field__icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.5" stroke="#6B7280" stroke-width="1.6"/><path d="M12.2 12.2L16 16" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <input class="search-view__input" id="stop-input" type="text" placeholder="Search a stop" autocomplete="off" />
        </div>
        <div class="suggestions-list" id="stop-suggestions-list"></div>
      </div>

      <!-- profile screen -->
      <div class="profile-panel" id="profile-panel" role="dialog" aria-label="Profile">
        <div class="statusbar statusbar--panel">
          <span class="statusbar__time">9:41</span>
          <div class="statusbar__icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="1" y="7" width="3" height="4" rx="0.5" fill="currentColor"/><rect x="6" y="5" width="3" height="6" rx="0.5" fill="currentColor"/><rect x="11" y="2" width="3" height="9" rx="0.5" fill="currentColor"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5.2L13.4 6.3C12 4.9 10.1 4 8 4C5.9 4 4 4.9 2.6 6.3L1.5 5.2C3.2 3.5 5.5 2.5 8 2.5ZM8 6.2C9.4 6.2 10.7 6.8 11.6 7.7L10.5 8.8C9.9 8.2 9 7.7 8 7.7C7 7.7 6.1 8.2 5.5 8.8L4.4 7.7C5.3 6.8 6.6 6.2 8 6.2ZM8 9.9C8.6 9.9 9.1 10.1 9.5 10.5L8 12L6.5 10.5C6.9 10.1 7.4 9.9 8 9.9Z" fill="currentColor"/></svg>
            <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="currentColor" stroke-width="1"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.7" fill="currentColor"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.2" fill="currentColor"/></svg>
          </div>
        </div>
        <div class="profile-panel__header">
          <button class="icon-btn-back" id="profile-back-btn" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3.5L5 9L11 14.5" stroke="#14171F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="profile-panel__title">Profile</span>
          <span class="profile-panel__spacer" aria-hidden="true"></span>
        </div>
        <div class="profile-panel__body">
          <div class="profile-panel__avatar">
            <svg width="30" height="30" viewBox="0 0 19 19" fill="none"><circle cx="9.5" cy="6.6" r="3.1" stroke="#14171F" stroke-width="1.4"/><path d="M3.3 16C4.2 12.6 6.6 11 9.5 11C12.4 11 14.8 12.6 15.7 16" stroke="#14171F" stroke-width="1.4" stroke-linecap="round"/></svg>
          </div>
          <div class="profile-panel__name">Your name</div>
          <div class="profile-panel__sub">Add your email to get started</div>

          <div class="profile-panel__list">
            <button class="profile-row">
              <span class="profile-row__text">Payment methods</span>
              <svg class="option-row__chevron" width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5L6.5 7L1.5 12.5" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="profile-row">
              <span class="profile-row__text">Ride history</span>
              <svg class="option-row__chevron" width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5L6.5 7L1.5 12.5" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="profile-row">
              <span class="profile-row__text">Settings</span>
              <svg class="option-row__chevron" width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5L6.5 7L1.5 12.5" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="profile-row">
              <span class="profile-row__text">Help &amp; support</span>
              <svg class="option-row__chevron" width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1.5 1.5L6.5 7L1.5 12.5" stroke="#9CA3AF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="profile-row profile-row--danger">
              <span class="profile-row__text">Log out</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
